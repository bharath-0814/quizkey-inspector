<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page: Exposed Network API Response</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 600px; margin: 0 auto; line-height: 1.5; }
    .question-card { border: 1px solid #ccc; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .option { display: block; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Sample Assessment Page</h1>
  <p><em>Test fixture simulating an existing website fetching questions via API that exposes correctIndex.</em></p>

  <div id="container">
    <div class="question-card" data-question-id="42">
      <h3>1. Which protocol is connectionless?</h3>
      <label class="option"><input type="radio" name="q42" value="TCP"> A. TCP</label>
      <label class="option"><input type="radio" name="q42" value="UDP"> B. UDP</label>
      <label class="option"><input type="radio" name="q42" value="FTP"> C. FTP</label>
      <label class="option"><input type="radio" name="q42" value="SSH"> D. SSH</label>
    </div>
  </div>

  <script>
    // Simulate network fetch response received naturally by the page
    // Trigger CustomEvent to test network monitor interception
    setTimeout(() => {
      document.dispatchEvent(new CustomEvent('__quizkey_network_data__', {
        detail: {
          url: '/api/v1/assessment/questions',
          method: 'GET',
          data: {
            questions: [
              {
                id: 42,
                question: "Which protocol is connectionless?",
                options: ["TCP", "UDP", "FTP", "SSH"],
                correctIndex: 1
              }
            ]
          }
        }
      }));
    }, 50);
  </script>
</body>
</html>
