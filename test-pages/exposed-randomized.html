<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page: Exposed State with Randomized Option Order</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 600px; margin: 0 auto; line-height: 1.5; }
    .question-card { border: 1px solid #ccc; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .option { display: block; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Sample Assessment Page (Randomized Order)</h1>
  <p><em>Test fixture simulating an assessment where the client randomizes the display order of options, while author state maintains original indices.</em></p>

  <div class="question-card" data-question-id="42">
    <h3>1. Which protocol is connectionless?</h3>
    <!-- Rendered in randomized order: C is UDP, B is SSH -->
    <label class="option"><input type="radio" name="q42" value="FTP"> A. FTP</label>
    <label class="option"><input type="radio" name="q42" value="SSH"> B. SSH</label>
    <label class="option"><input type="radio" name="q42" value="UDP"> C. UDP</label>
    <label class="option"><input type="radio" name="q42" value="TCP"> D. TCP</label>
  </div>

  <script>
    // Author original definition: correctIndex is 1 ("UDP") in author array,
    // even though it was rendered at position C (index 2) in the DOM.
    const quizState = {
      questions: [
        {
          id: 42,
          question: "Which protocol is connectionless?",
          options: ["TCP", "UDP", "FTP", "SSH"],
          correctIndex: 1
        }
      ]
    };
  </script>
</body>
</html>
