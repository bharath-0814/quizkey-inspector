<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page: Exposed Response IDs</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 600px; margin: 0 auto; line-height: 1.5; }
    .question-card { border: 1px solid #ccc; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .option { display: block; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Sample Assessment Page (Response IDs)</h1>
  <p><em>Test fixture simulating an assessment application using correctOptionId / correctResponseId.</em></p>

  <div class="question-card" data-question-id="q100">
    <h3>1. Which protocol is connectionless?</h3>
    <label class="option" data-option-id="opt_tcp"><input type="radio" name="q100" value="opt_tcp"> A. TCP</label>
    <label class="option" data-option-id="opt_udp"><input type="radio" name="q100" value="opt_udp"> B. UDP</label>
    <label class="option" data-option-id="opt_ftp"><input type="radio" name="q100" value="opt_ftp"> C. FTP</label>
    <label class="option" data-option-id="opt_ssh"><input type="radio" name="q100" value="opt_ssh"> D. SSH</label>
  </div>

  <script>
    // Author grading metadata uses correctOptionId
    const assessmentData = {
      items: [
        {
          id: "q100",
          question: "Which protocol is connectionless?",
          choices: [
            { id: "opt_tcp", text: "TCP" },
            { id: "opt_udp", text: "UDP" },
            { id: "opt_ftp", text: "FTP" },
            { id: "opt_ssh", text: "SSH" }
          ],
          correctOptionId: "opt_udp"
        }
      ]
    };
  </script>
</body>
</html>
