<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page: Exposed Embedded JSON</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 600px; margin: 0 auto; line-height: 1.5; }
    .question-card { border: 1px solid #ccc; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .option { display: block; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Sample Assessment Page</h1>
  <p><em>Test fixture simulating an existing website with embedded JSON state.</em></p>

  <div class="question-card" data-question-id="10">
    <h3>1. Which data structure operates on a FIFO basis?</h3>
    <label class="option"><input type="radio" name="q10" value="Stack"> A. Stack</label>
    <label class="option"><input type="radio" name="q10" value="Queue"> B. Queue</label>
    <label class="option"><input type="radio" name="q10" value="Tree"> C. Tree</label>
  </div>

  <!-- Framework hydration state leaking answer key -->
  <script type="application/json" id="__PAGE_STATE__">
    {
      "items": [
        {
          "id": 10,
          "question": "Which data structure operates on a FIFO basis?",
          "options": ["Stack", "Queue", "Tree"],
          "correctOption": "Queue",
          "correctIndex": 1
        }
      ]
    }
  </script>
</body>
</html>
