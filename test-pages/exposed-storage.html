<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page: Exposed Browser Storage</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 600px; margin: 0 auto; line-height: 1.5; }
    .question-card { border: 1px solid #ccc; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .option { display: block; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Sample Assessment Page</h1>
  <p><em>Test fixture simulating an existing website storing quiz answers in localStorage.</em></p>

  <div class="question-card" data-question-id="20">
    <h3>1. Which symmetric encryption algorithm uses 256-bit keys?</h3>
    <label class="option"><input type="radio" name="q20" value="DES"> A. DES</label>
    <label class="option"><input type="radio" name="q20" value="RSA"> B. RSA</label>
    <label class="option"><input type="radio" name="q20" value="AES-256"> C. AES-256</label>
    <label class="option"><input type="radio" name="q20" value="MD5"> D. MD5</label>
  </div>

  <script>
    // Existing page script persists answer key to client storage
    try {
      localStorage.setItem('cached_quiz_answers', JSON.stringify({
        questions: [
          {
            id: 20,
            question: "Which symmetric encryption algorithm uses 256-bit keys?",
            options: ["DES", "RSA", "AES-256", "MD5"],
            correctAnswer: "AES-256",
            correctIndex: 2
          }
        ]
      }));
    } catch (e) {}
  </script>
</body>
</html>
