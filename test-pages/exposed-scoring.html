<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page: Exposed Response Scoring</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 600px; margin: 0 auto; line-height: 1.5; }
    .question-card { border: 1px solid #ccc; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .option { display: block; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Sample Assessment Page (Response Scoring)</h1>
  <p><em>Test fixture simulating an assessment application exposing grading points or score per response.</em></p>

  <div class="question-card" data-question-id="q200">
    <h3>1. Which protocol is connectionless?</h3>
    <label class="option"><input type="radio" name="q200" value="TCP"> A. TCP</label>
    <label class="option"><input type="radio" name="q200" value="UDP"> B. UDP</label>
    <label class="option"><input type="radio" name="q200" value="FTP"> C. FTP</label>
    <label class="option"><input type="radio" name="q200" value="SSH"> D. SSH</label>
  </div>

  <script>
    // Author response scoring configuration
    const quizMetadata = {
      questions: [
        {
          id: "q200",
          question: "Which protocol is connectionless?",
          options: [
            { text: "TCP", score: 0 },
            { text: "UDP", score: 1 },
            { text: "FTP", score: 0 },
            { text: "SSH", score: 0 }
          ]
        }
      ]
    };
  </script>
</body>
</html>
