<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page: Exposed isCorrect Flags on Choices</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 600px; margin: 0 auto; line-height: 1.5; }
    .question-card { border: 1px solid #ccc; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .option { display: block; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Sample Assessment Page (isCorrect Choice Flags)</h1>
  <p><em>Test fixture simulating an assessment where choices include an isCorrect: true boolean.</em></p>

  <div class="question-card" data-question-id="q300">
    <h3>1. Which protocol is connectionless?</h3>
    <label class="option"><input type="radio" name="q300" value="TCP"> A. TCP</label>
    <label class="option"><input type="radio" name="q300" value="UDP"> B. UDP</label>
    <label class="option"><input type="radio" name="q300" value="FTP"> C. FTP</label>
    <label class="option"><input type="radio" name="q300" value="SSH"> D. SSH</label>
  </div>

  <script>
    const examQuestions = [
      {
        id: "q300",
        question: "Which protocol is connectionless?",
        options: [
          { text: "TCP", isCorrect: false },
          { text: "UDP", isCorrect: true },
          { text: "FTP", isCorrect: false },
          { text: "SSH", isCorrect: false }
        ]
      }
    ];
  </script>
</body>
</html>
